name: Finish portfolio import

on:
  push:
    paths:
      - portfolio-source.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract portfolio source
        run: |
          python -m zipfile -e portfolio-source.zip .
          rm portfolio-source.zip
          rm .github/workflows/unpack-portfolio.yml
      - name: Commit finished source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Chisto portfolio source"
          git push
